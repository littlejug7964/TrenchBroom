{
    "version": 9,
    "name": "Anachronox",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Quake2" }
    ],
    "filesystem": {
        "searchpath": "anoxdata",
        "packageformat": { "extensions": [ ".dat", ".zip" ], "format": "anox" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".tga", ".png", ".bmp", ".atd" ]
    },
    "entities": {
        "definitions": [ "Anachronox.fgd" ],
        "gameDefinitions": [ "models/entity.dat" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Areaportal",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "*_areaportal"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "contentflag",
                "flags": [ "playerclip", "monsterclip" ]
            },
            {
                "name": "Detail",
                "match": "contentflag",
                "flags": [ "detail" ]
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": ["hint"]
            },
            {
                "name": "Liquid",
                "match": "contentflag",
                "flags": [ "lava", "slime", "water" ]
            },
            {
                "name": "Nodraw",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "nodraw" ]
            },
            {
                "name": "Origin",
                "attribs": [ "transparent" ],
                "match": "contentflag",
                "flags": [ "origin" ]
            },
            {
                "name": "Skip",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": ["skip"]
            },
            {
                "name": "Sky",
                "attribs": [],
                "match": "surfaceflag",
                "flags": ["sky"]
            },
            {
                "name": "Slick",
                "attribs": [],
                "match": "surfaceflag",
                "flags": ["slick"]
            },
            {
                "name": "Transparent",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "trans33", "trans66", "alphabanner", "alphatest" ]
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [
